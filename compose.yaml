services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hermy_hq
      POSTGRES_USER: hermy_hq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - hermy_hq_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermy_hq -d hermy_hq"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hermy-hq.rule=Host(`hq.joshbuilds.tech`)"
      - "traefik.http.routers.hermy-hq.entrypoints=websecure"
      - "traefik.http.routers.hermy-hq.tls=true"
      - "traefik.http.routers.hermy-hq.tls.certresolver=letsencrypt"
      - "traefik.http.services.hermy-hq.loadbalancer.server.port=3000"
    security_opt:
      - no-new-privileges:true

  # Bridges Hermy HQ's Postgres to your actual Hermes install over HTTP:
  # - Chat/health/crons: the Hermes gateway's OpenAI-compatible API server
  #   (port 8642, HERMES_API_URL/HERMES_API_KEY from .env).
  # - Kanban reads: bind-mounted kanban.db, read-only (below), same as before.
  # - Kanban WRITES (new): the Hermes dashboard's authenticated REST API
  #   (HERMES_DASHBOARD_URL/USERNAME/PASSWORD from .env, port 4860 on the
  #   same hermes-agent container/network). Oneshot "ask Hermes" dispatches
  #   from the website now create real triaged kanban tasks via this path
  #   instead of a synchronous chat reply, so they show up and move live on
  #   /tasks exactly like any Telegram/CLI-originated task.
  # No shelling into the `hermes` CLI, no mounting the live agent's full
  # /opt/data (no concurrent access to its session/state files).
  hermes-bridge:
    build: ./hermes-bridge
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Only the main .db file is mounted — NOT its -wal/-shm sidecars.
      # Those two are dynamically deleted/recreated by SQLite as writer
      # connections open and close; if that happens at the exact instant
      # Docker (re)creates this container, Docker silently creates an empty
      # DIRECTORY at that host path instead of erroring, permanently
      # breaking the bind mount until someone notices and fixes it by hand.
      # We only ever read this DB (readonly, fileMustExist) for a live
      # status mirror — occasionally missing the last few WAL-only writes
      # (visible again after the writer's next auto-checkpoint, ~1000
      # pages or on connection close) is a far better failure mode here
      # than a container that silently stops starting.
      - /docker/hermes-agent-mnis/data/kanban.db:/hermes-ro/kanban.db:ro
    security_opt:
      - no-new-privileges:true

volumes:
  hermy_hq_postgres:


