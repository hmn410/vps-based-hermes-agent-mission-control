services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hermy_hq
      POSTGRES_USER: hermy_hq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - hermy_hq_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermy_hq -d hermy_hq"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HERMES_WIKI_ROOT: /wiki
    volumes:
      # Shared Hermes read-me wiki (/wiki page). ONLY the canonical wiki
      # directory is mounted — not /opt/data, no secrets, no other host files.
      # Read-write so Hermy HQ edits land in the same Markdown files every
      # Hermes profile reads; src/lib/wiki-fs.ts further restricts access to
      # .md files inside this root with conflict detection on save.
      # Directory (not file) mount, so Hermes' in-place or rename-based
      # writes are seen immediately (see the kanban-mirror note below).
      # Hermy HQ saves atomically too (temp file + rename in the same dir),
      # which a directory mount requires. The image runs as uid/gid
      # 10000:10000, the owner of this directory, so it must stay writable
      # by 10000 and new files land with the same owner as the rest.
      - /docker/hermes-agent-mnis/data/home/.hermes/wiki:/wiki
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hermy-hq.rule=Host(`hq.joshbuilds.tech`)"
      - "traefik.http.routers.hermy-hq.entrypoints=websecure"
      - "traefik.http.routers.hermy-hq.tls=true"
      - "traefik.http.routers.hermy-hq.tls.certresolver=letsencrypt"
      - "traefik.http.services.hermy-hq.loadbalancer.server.port=3000"
    security_opt:
      - no-new-privileges:true

  # Bridges Hermy HQ's Postgres to your actual Hermes install over HTTP:
  # - Chat/health/crons: the Hermes gateway's OpenAI-compatible API server
  #   (port 8642, HERMES_API_URL/HERMES_API_KEY from .env).
  # - Kanban reads: bind-mounted kanban.db, read-only (below), same as before.
  # - Kanban WRITES (new): the Hermes dashboard's authenticated REST API
  #   (HERMES_DASHBOARD_URL/USERNAME/PASSWORD from .env, port 4860 on the
  #   same hermes-agent container/network). Oneshot "ask Hermes" dispatches
  #   from the website now create real triaged kanban tasks via this path
  #   instead of a synchronous chat reply, so they show up and move live on
  #   /tasks exactly like any Telegram/CLI-originated task.
  # No shelling into the `hermes` CLI, no mounting the live agent's full
  # /opt/data (no concurrent access to its session/state files).
  hermes-bridge:
    build: ./hermes-bridge
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mounts the MIRROR DIRECTORY, not the single kanban.db file inside it.
      # This matters: a bind mount of a single FILE binds to that exact
      # inode at container-start time — if the host later replaces the file
      # via an atomic rename (which snapshot-kanban-mirror.py does, to
      # avoid the bridge ever reading a half-written file), a single-file
      # mount can keep serving the ORIGINAL, now-stale inode forever,
      # silently never updating again. Mounting the parent directory
      # avoids this: path lookups inside a directory mount are resolved
      # fresh on every access, so a rename'd-in replacement file is seen
      # immediately, exactly like reading it directly on the host would be.
      #
      # A cron job on the Hermes agent side (snapshot-kanban-mirror.py,
      # every 1m) copies the live WAL-mode kanban.db via SQLite's own
      # backup API into kanban-mirror/kanban.db and converts it to plain
      # rollback-journal mode (PRAGMA journal_mode=DELETE) — a mode that
      # needs zero -wal/-shm sidecar files, ever, to be read.
      #
      # Why not mount the live kanban.db directly: its -wal/-shm sidecars
      # are dynamically deleted/recreated by SQLite as the real
      # orchestrator's writer connections open and close. If a container
      # (re)create ever lands in the instant those sidecars don't exist,
      # Docker silently creates an empty DIRECTORY at that host path
      # instead of erroring, permanently breaking the bind mount. This
      # mirror file never has sidecars to begin with, so that failure mode
      # is structurally impossible here.
      #
      # Trade-off: kanban state on the website can lag up to ~1 minute
      # behind the real orchestrator (the snapshot interval) instead of
      # being byte-for-byte live — a deliberate trade for total stability
      # after repeated mount crashes/corruption on earlier attempts.
      - /docker/hermes-agent-mnis/data/kanban-mirror:/hermes-ro:ro
    security_opt:
      - no-new-privileges:true

volumes:
  hermy_hq_postgres:


